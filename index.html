<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#bfe3f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Badb Clock</title>
</head>
<body>

<!-- Screen 1: choose the transition -->
<section id="screen-choose" class="screen active">
  <h1 class="screen-title">Where are we going?</h1>
  <div id="transition-grid" class="card-grid"></div>
  <button id="videos-btn" class="videos-big-btn"><span class="emoji">🎬</span> Videos</button>
  <div class="settings-row">
    <span class="settings-label">Who is going?</span>
    <div id="character-picker" class="character-picker"></div>
    <span id="version-tag" class="version-tag"></span>
  </div>
</section>

<!-- Screen: instant videos (rescue player) -->
<section id="screen-videos" class="screen">
  <button id="back-videos" class="back-btn" aria-label="Go back">←</button>
  <h1 class="screen-title">Videos</h1>
  <div id="video-grid" class="video-grid"></div>
  <div class="settings-row">
    <div class="food-admin">
      <label class="admin-btn">🎞 Add from my videos<input type="file" id="video-input" accept="video/*" hidden></label>
      <label class="admin-btn">📁 Add from files<input type="file" id="video-input-files" hidden></label>
      <button id="video-remove-btn" class="admin-btn" hidden>🗑 Remove</button>
      <a class="admin-btn" href="https://www.youtube.com/feed/downloads">▶ YouTube downloads</a>
    </div>
    <span id="video-hint" class="settings-label"></span>
  </div>
</section>

<!-- fullscreen instant player -->
<div id="video-player" class="video-overlay" hidden>
  <video id="video-el" playsinline loop controls controlslist="nodownload"></video>
  <button id="video-close" class="back-btn" aria-label="Close video">✕</button>
</div>

<!-- Screen 1b: dinner or dessert? (food transition only) -->
<section id="screen-food-category" class="screen">
  <button id="back-category" class="back-btn" aria-label="Go back">←</button>
  <h1 class="screen-title">Dinner or dessert?</h1>
  <div class="card-grid two">
    <button class="transition-card" id="cat-dinner"><span class="emoji">🍽️</span><span class="label">Dinner</span></button>
    <button class="transition-card" id="cat-dessert"><span class="emoji">🍨</span><span class="label">Dessert</span></button>
  </div>
</section>

<!-- Screen 1c: pick the food -->
<section id="screen-food" class="screen">
  <button id="back-food" class="back-btn" aria-label="Go back">←</button>
  <h1 class="screen-title">What are we having?</h1>
  <div id="food-grid" class="card-grid"></div>
  <div class="settings-row">
    <div class="food-admin">
      <button id="add-food-btn" class="admin-btn">＋ Add a food</button>
      <button id="edit-foods-btn" class="admin-btn" hidden>✎ Edit foods</button>
    </div>
  </div>
</section>

<!-- Screen 1d: add or edit a custom food (parent flow) -->
<section id="screen-add-food" class="screen">
  <button id="back-add-food" class="back-btn" aria-label="Go back">←</button>
  <h1 id="add-food-title" class="screen-title">Add a food</h1>
  <div class="add-food-form">
    <label class="photo-drop">
      <input type="file" id="food-photo-input" accept="image/*" hidden>
      <span id="photo-drop-hint">🖼 Tap to add a photo</span>
      <img id="photo-preview" class="photo-preview" alt="" hidden>
    </label>
    <div class="food-admin">
      <label class="admin-btn">📷 Camera<input type="file" id="food-photo-camera" accept="image/*" capture="environment" hidden></label>
      <label class="admin-btn">🖼 My photos<input type="file" id="food-photo-gallery" accept="image/*" hidden></label>
    </div>
    <button id="cartoon-toggle" class="control-btn" hidden>🎨 Cartoon: on</button>
    <input type="text" id="food-name" class="text-input" placeholder="What is it called?" maxlength="24">
    <div class="cat-chips">
      <button class="cat-chip" data-cat="dinner">Dinner</button>
      <button class="cat-chip" data-cat="dessert">Dessert</button>
      <button class="cat-chip" data-cat="both">Both</button>
    </div>
    <button id="save-food" class="control-btn big" disabled>✓ Save</button>
  </div>
</section>

<!-- Screen 1e: manage custom foods -->
<section id="screen-edit-foods" class="screen">
  <button id="back-edit-foods" class="back-btn" aria-label="Go back">←</button>
  <h1 class="screen-title">Your foods</h1>
  <div id="edit-food-list" class="edit-food-list"></div>
</section>

<!-- Screen 2: choose the time -->
<section id="screen-time" class="screen">
  <button id="back-to-choose" class="back-btn" aria-label="Go back">←</button>
  <div class="chosen-transition">
    <span id="time-emoji" class="chosen-emoji"></span>
    <h1 id="time-title" class="screen-title"></h1>
  </div>
  <h2 class="screen-subtitle">How long?</h2>
  <div id="time-grid" class="time-grid"></div>
  <div class="custom-time">
    <div class="custom-row">
      <span class="custom-label">⏱ Minutes</span>
      <input type="number" id="custom-minutes" class="mini-input" min="1" max="720" inputmode="numeric" placeholder="20">
      <button id="custom-minutes-go" class="control-btn">Go</button>
    </div>
    <div class="custom-row">
      <span class="custom-label">🕗 Finish at</span>
      <input type="time" id="custom-until" class="mini-input">
      <button id="custom-until-go" class="control-btn">Go</button>
    </div>
  </div>
</section>

<!-- Screen 3: the countdown scene -->
<section id="screen-timer" class="screen">
  <button id="cancel-timer" class="back-btn" aria-label="Stop and go back">←</button>
  <div id="timer-phrase" class="timer-phrase"></div>
  <div id="scene" class="scene">
    <div class="sky">
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="sun"></div>
    </div>
    <div class="ground"></div>
    <div id="walker" class="walker"><span id="walker-emoji"></span></div>
    <div id="destination" class="destination"><span id="destination-emoji"></span></div>
  </div>
  <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
  <div id="time-left" class="time-left">0:00</div>
  <div class="timer-controls">
    <button id="pause-btn" class="control-btn">⏸ Pause</button>
    <button id="music-btn" class="control-btn">🎵 Music on</button>
  </div>
</section>

<!-- Screen 4: time's up -->
<section id="screen-done" class="screen">
  <div id="confetti" class="confetti" aria-hidden="true"></div>
  <div class="done-scene">
    <span id="done-emoji" class="done-emoji"></span>
  </div>
  <h1 id="done-phrase" class="done-phrase"></h1>
  <div class="done-buttons">
    <button id="again-btn" class="control-btn big">↻ Again</button>
    <button id="home-btn" class="control-btn big">🏡 Home</button>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
