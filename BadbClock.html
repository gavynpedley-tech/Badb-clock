<style>
/* Badb Clock — calm, predictable, big-touch-target styling.
   Palette is deliberately soft: low-saturation sky blues and creams,
   no pure white, no harsh contrast jumps, nothing flashes. */

:root {
  --sky: #bfe3f2;
  --sky-deep: #a5d4ea;
  --ground: #b8dfa8;
  --cream: #fdf8ef;
  --card: #ffffffcc;
  --ink: #3a4a58;
  --ink-soft: #6b7c8a;
  --accent: #f5b971;
  --accent-warm: #f0a35e;
  --good: #8fc98f;
  --radius: 24px;
  --shadow: 0 4px 14px rgba(58, 74, 88, 0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  font-family: "SF Pro Rounded", ui-rounded, "Comic Sans MS", "Segoe UI", system-ui, sans-serif;
  background: linear-gradient(var(--sky), var(--cream) 70%);
  color: var(--ink);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

.screen {
  display: none;
  position: fixed;
  inset: 0;
  flex-direction: column;
  align-items: center;
  padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  overflow-y: auto;
}
.screen.active { display: flex; }

.screen-title {
  font-size: clamp(1.6rem, 5vw, 2.4rem);
  font-weight: 700;
  margin: 12px 0 20px;
  text-align: center;
}
.screen-subtitle {
  font-size: clamp(1.3rem, 4vw, 1.9rem);
  font-weight: 700;
  margin: 8px 0 20px;
  color: var(--ink-soft);
}

/* ---------- Screen 1: transition cards ---------- */

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 14px;
  width: 100%;
  max-width: 720px;
}

.transition-card {
  background: var(--card);
  border: 3px solid transparent;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px 10px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-family: inherit;
  color: inherit;
  transition: transform 0.15s ease, border-color 0.15s ease;
}
.transition-card:active { transform: scale(0.95); border-color: var(--accent); }
.transition-card .emoji { font-size: clamp(2.6rem, 8vw, 3.6rem); line-height: 1; }
.transition-card .label { font-size: clamp(1rem, 3vw, 1.2rem); font-weight: 700; }

.settings-row {
  margin-top: 26px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.settings-label { font-size: 1rem; color: var(--ink-soft); font-weight: 600; }
.version-tag { font-size: 0.75rem; color: var(--ink-soft); opacity: 0.6; font-weight: 600; }
.character-picker { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.character-option {
  font-size: 1.9rem;
  background: var(--card);
  border: 3px solid transparent;
  border-radius: 16px;
  padding: 6px 10px;
  cursor: pointer;
  transition: border-color 0.15s ease, transform 0.15s ease;
}
.character-option.selected { border-color: var(--accent); transform: scale(1.08); }
.character-option { position: relative; }
.character-option .char-photo { width: 1.9rem; height: 1.9rem; display: block; }
.character-option.add-character {
  display: grid;
  place-items: center;
  color: var(--ink-soft);
  font-weight: 800;
  min-width: 2.6rem;
}
.char-remove {
  position: absolute;
  top: -7px;
  right: -7px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #e05a8a;
  color: #fff;
  font-size: 0.7rem;
  font-weight: 800;
  display: grid;
  place-items: center;
  box-shadow: var(--shadow);
}

/* photo characters — round face crop everywhere they appear */
.char-photo {
  height: 1em;
  width: 1em;
  border-radius: 50%;
  object-fit: cover;
  display: inline-block;
  vertical-align: baseline;
  background: #fff;
  box-shadow: 0 2px 6px rgba(58, 74, 88, 0.25);
}
.walker .char-photo { height: 1.6em; width: 1.6em; }
.done-emoji .char-photo { height: 1em; width: 1em; margin-right: 0.08em; }

/* ---------- Screen 2: time buttons ---------- */

.back-btn {
  position: absolute;
  top: max(14px, env(safe-area-inset-top));
  left: 14px;
  font-size: 1.5rem;
  width: 52px;
  height: 52px;
  border: none;
  border-radius: 50%;
  background: var(--card);
  box-shadow: var(--shadow);
  color: var(--ink);
  cursor: pointer;
}
.back-btn:active { transform: scale(0.92); }

.chosen-transition { display: flex; flex-direction: column; align-items: center; margin-top: 30px; }
.chosen-emoji { font-size: clamp(3rem, 10vw, 4.5rem); line-height: 1.2; }

.time-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 14px;
  width: 100%;
  max-width: 560px;
}
.time-btn {
  background: var(--card);
  border: 3px solid transparent;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px 10px;
  font-family: inherit;
  font-size: clamp(1.3rem, 4vw, 1.7rem);
  font-weight: 700;
  color: var(--ink);
  cursor: pointer;
  transition: transform 0.15s ease, border-color 0.15s ease;
}
.time-btn:active { transform: scale(0.95); border-color: var(--accent); }

.custom-time {
  margin-top: 22px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 420px;
}
.custom-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--card);
  border-radius: 999px;
  box-shadow: var(--shadow);
  padding: 8px 10px 8px 20px;
}
.custom-label { font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
.mini-input {
  font-family: inherit;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--ink);
  background: var(--cream);
  border: 2px solid transparent;
  border-radius: 12px;
  padding: 8px 10px;
  flex: 1;
  min-width: 0;
  text-align: center;
  outline: none;
}
.mini-input:focus { border-color: var(--accent); }
.custom-row .control-btn { padding: 10px 20px; box-shadow: none; background: var(--accent); color: #fff; }

/* ---------- Screen 3: countdown scene ---------- */

#screen-timer { justify-content: center; gap: 14px; }

.timer-phrase {
  font-size: clamp(1.3rem, 4.5vw, 2rem);
  font-weight: 700;
  text-align: center;
}

.scene {
  position: relative;
  width: 100%;
  max-width: 760px;
  height: clamp(200px, 36vh, 320px);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  background: linear-gradient(var(--sky-deep), var(--sky) 75%);
  flex-shrink: 0;
}
.sky { position: absolute; inset: 0 0 22% 0; }
.ground {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 22%;
  background: var(--ground);
  border-top: 4px solid #a3cf93;
}
.sun {
  position: absolute;
  top: 14px; right: 20px;
  width: 52px; height: 52px;
  border-radius: 50%;
  background: #fce8a8;
  box-shadow: 0 0 30px 10px #fce8a866;
}
.cloud {
  position: absolute;
  background: #ffffffd9;
  border-radius: 999px;
  height: 26px;
}
.cloud::before {
  content: "";
  position: absolute;
  background: inherit;
  border-radius: 50%;
  width: 30px; height: 30px;
  top: -12px; left: 18px;
}
.cloud-1 { width: 80px; top: 30px; left: 12%; animation: drift 60s linear infinite; }
.cloud-2 { width: 60px; top: 66px; left: 55%; animation: drift 80s linear infinite reverse; }
@keyframes drift {
  from { transform: translateX(0); }
  50%  { transform: translateX(60px); }
  to   { transform: translateX(0); }
}

.walker {
  position: absolute;
  bottom: 14%;
  left: 4%;
  font-size: clamp(3rem, 9vw, 4.4rem);
  line-height: 1;
  transition: left 1s linear;
  z-index: 2;
}
.walker.walking span { display: inline-block; animation: bob 0.7s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50%      { transform: translateY(-7px) rotate(2deg); }
}

.destination {
  position: absolute;
  bottom: 12%;
  right: 4%;
  font-size: clamp(4.4rem, 14vw, 6.6rem);
  line-height: 1;
  z-index: 1;
}
.destination.huge { font-size: clamp(7rem, 24vw, 11rem); bottom: 10%; }
.destination.center { right: 50%; transform: translateX(50%); }
.destination.nearly span { display: inline-block; animation: gentle-pulse 1.6s ease-in-out infinite; }
@keyframes gentle-pulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.07); }
}

.progress-track {
  width: 100%;
  max-width: 760px;
  height: 26px;
  border-radius: 999px;
  background: #ffffffb0;
  box-shadow: inset 0 2px 6px rgba(58, 74, 88, 0.15);
  overflow: hidden;
  flex-shrink: 0;
}
.progress-fill {
  height: 100%;
  width: 100%;
  border-radius: 999px;
  background: var(--good);
  transition: width 1s linear, background-color 1s ease;
}
.progress-fill.nearly { background: var(--accent-warm); }

.time-left {
  font-size: clamp(2.4rem, 9vw, 4rem);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
}

.timer-controls { display: flex; gap: 14px; }

.control-btn {
  font-family: inherit;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--ink);
  background: var(--card);
  border: none;
  border-radius: 999px;
  box-shadow: var(--shadow);
  padding: 14px 26px;
  cursor: pointer;
}
.control-btn:active { transform: scale(0.95); }
.control-btn.big { font-size: 1.4rem; padding: 18px 34px; }

/* ---------- Screen 4: done ---------- */

#screen-done { justify-content: center; gap: 22px; }

.done-scene { position: relative; }
.done-emoji {
  font-size: clamp(5rem, 20vw, 8rem);
  line-height: 1.1;
  display: inline-block;
  animation: arrive 0.9s ease;
}
@keyframes arrive {
  0%   { transform: scale(0.6); opacity: 0; }
  60%  { transform: scale(1.08); }
  100% { transform: scale(1); opacity: 1; }
}

.done-phrase {
  font-size: clamp(1.6rem, 6vw, 2.6rem);
  font-weight: 800;
  text-align: center;
}

.done-buttons { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.confetti span {
  position: absolute;
  top: -30px;
  font-size: 1.4rem;
  animation: fall linear forwards;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(200deg); opacity: 0.6; }
}

/* ---------- drawn avatars (SVG characters mixed in with emoji ones) ---------- */

.char-img {
  height: 1.2em;
  width: auto;
  display: inline-block;
  vertical-align: baseline;
}
.walker .char-img { height: 2em; }
.character-option .char-img { height: 2.1rem; display: block; }
.done-emoji .char-img { height: 1em; margin-right: 0.08em; }
.arrival-svg { height: clamp(240px, 42vh, 340px); width: auto; display: block; }

/* drawn food pictures, sized like the emoji they sit beside */
.food-svg { height: 1em; width: auto; display: inline-block; vertical-align: baseline; }
.transition-card .emoji .food-svg { height: clamp(2.6rem, 8vw, 3.6rem); display: block; }
.card-grid.two { max-width: 460px; }

/* photo foods (user-added) — rounded square, cropped to fill */
.food-photo {
  height: 1em;
  width: 1em;
  border-radius: 22%;
  object-fit: cover;
  display: inline-block;
  vertical-align: baseline;
  background: #fff;
}
.transition-card .emoji .food-photo {
  height: clamp(2.6rem, 8vw, 3.6rem);
  width: clamp(2.6rem, 8vw, 3.6rem);
  display: block;
}

/* ---------- add / edit foods (parent screens) ---------- */

.food-admin { display: flex; gap: 10px; }
.admin-btn {
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--ink-soft);
  background: var(--card);
  border: none;
  border-radius: 999px;
  box-shadow: var(--shadow);
  padding: 10px 18px;
  cursor: pointer;
}
.admin-btn:active { transform: scale(0.95); }

.add-food-form {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  width: 100%;
  max-width: 420px;
  margin-top: 6px;
}
.photo-drop {
  width: min(60vw, 260px);
  height: min(60vw, 260px);
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: var(--shadow);
  border: 3px dashed #c8d6e0;
  display: grid;
  place-items: center;
  cursor: pointer;
  overflow: hidden;
}
#photo-drop-hint { color: var(--ink-soft); font-weight: 700; text-align: center; padding: 10px; }
.photo-preview { width: 100%; height: 100%; object-fit: cover; }

.text-input {
  font-family: inherit;
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--ink);
  background: var(--card);
  border: 3px solid transparent;
  border-radius: 999px;
  box-shadow: var(--shadow);
  padding: 12px 22px;
  width: 100%;
  text-align: center;
  outline: none;
}
.text-input:focus { border-color: var(--accent); }

.cat-chips { display: flex; gap: 10px; }
.cat-chip {
  font-family: inherit;
  font-size: 1rem;
  font-weight: 700;
  color: var(--ink-soft);
  background: var(--card);
  border: 3px solid transparent;
  border-radius: 999px;
  box-shadow: var(--shadow);
  padding: 10px 20px;
  cursor: pointer;
}
.cat-chip.selected { border-color: var(--accent); color: var(--ink); }
.control-btn:disabled { opacity: 0.45; cursor: default; }

/* ---------- instant videos ---------- */

.videos-big-btn {
  margin-top: 20px;
  width: 100%;
  max-width: 720px;
  font-family: inherit;
  font-size: clamp(1.2rem, 4vw, 1.5rem);
  font-weight: 800;
  color: var(--ink);
  background: var(--card);
  border: 3px solid transparent;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  transition: transform 0.15s ease, border-color 0.15s ease;
}
.videos-big-btn:active { transform: scale(0.97); border-color: var(--accent); }
.videos-big-btn .emoji { font-size: 1.6em; line-height: 1; }

.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  width: 100%;
  max-width: 720px;
}
.video-tile {
  position: relative;
  border: none;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  background: #1d242c;
  aspect-ratio: 16 / 9;
  cursor: pointer;
  padding: 0;
}
.video-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.video-tile .placeholder {
  width: 100%; height: 100%;
  display: grid; place-items: center;
  font-size: 2.6rem;
}
.video-tile .name {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 8px 12px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(transparent, rgba(20, 26, 33, 0.85));
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.video-tile .play-badge {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 2.2rem;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  pointer-events: none;
}
.video-grid.removing .video-tile { outline: 3px dashed #e05a8a; outline-offset: -3px; }
.video-grid.removing .play-badge { display: none; }
.video-grid.removing .video-tile::after {
  content: "🗑";
  position: absolute;
  top: 8px; right: 10px;
  font-size: 1.6rem;
}
.video-grid.renaming .video-tile { outline: 3px dashed var(--accent); outline-offset: -3px; }
.video-grid.renaming .play-badge { display: none; }
.video-grid.renaming .video-tile::after {
  content: "✎";
  position: absolute;
  top: 8px; right: 10px;
  font-size: 1.6rem;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}
.food-admin a.admin-btn { text-decoration: none; display: inline-block; }

.video-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: #000;
}
.video-overlay video { width: 100%; height: 100%; object-fit: contain; }
.video-overlay .back-btn { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 14px; opacity: 0.85; }

.edit-food-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 480px;
}
.edit-food-row {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 10px 14px;
}
.edit-food-row img, .edit-food-row .food-svg { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; }
.edit-food-row .info { flex: 1; display: flex; flex-direction: column; }
.edit-food-row .info .name { font-weight: 800; font-size: 1.1rem; }
.edit-food-row .info .cats { color: var(--ink-soft); font-size: 0.85rem; font-weight: 600; }
.row-btn {
  font-size: 1.2rem;
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: var(--cream);
  cursor: pointer;
}
.row-btn:active { transform: scale(0.9); }

/* Respect users who need less motion: freeze the decorative animation,
   keep the position/width transitions that carry the countdown meaning. */
@media (prefers-reduced-motion: reduce) {
  .walker.walking span,
  .destination.nearly span,
  .cloud, .done-emoji,
  .confetti span { animation: none; }
}
</style>
<title>Badb Clock</title>
</head>
<body>

<!-- Screen 1: choose the transition -->
<section id="screen-choose" class="screen active">
  <h1 class="screen-title">Where are we going?</h1>
  <div id="transition-grid" class="card-grid"></div>
  <button id="videos-btn" class="videos-big-btn"><span class="emoji">🎬</span> Videos</button>
  <div class="settings-row">
    <span class="settings-label">Who is going?</span>
    <div id="character-picker" class="character-picker"></div>
    <span id="version-tag" class="version-tag"></span>
  </div>
</section>

<!-- Screen: instant videos (rescue player) -->
<section id="screen-videos" class="screen">
  <button id="back-videos" class="back-btn" aria-label="Go back">←</button>
  <h1 class="screen-title">Videos</h1>
  <div id="video-grid" class="video-grid"></div>
  <div class="settings-row">
    <div class="food-admin">
      <label class="admin-btn">🎞 Add from my videos<input type="file" id="video-input" accept="video/*" hidden></label>
      <label class="admin-btn">📁 Add from files<input type="file" id="video-input-files" hidden></label>
      <button id="video-rename-btn" class="admin-btn" hidden>✎ Rename</button>
      <button id="video-remove-btn" class="admin-btn" hidden>🗑 Remove</button>
      <a class="admin-btn" href="https://www.youtube.com/feed/downloads">▶ YouTube downloads</a>
    </div>
    <span id="video-hint" class="settings-label"></span>
  </div>
</section>

<!-- fullscreen instant player -->
<div id="video-player" class="video-overlay" hidden>
  <video id="video-el" playsinline loop controls controlslist="nodownload"></video>
  <button id="video-close" class="back-btn" aria-label="Close video">✕</button>
</div>

<!-- Screen 1b: dinner or dessert? (food transition only) -->
<section id="screen-food-category" class="screen">

/* ---------- custom photo foods, stored on the phone in IndexedDB ----------

let customFoods = [];
let customVideos = [];

function foodsDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("badb-clock", 3);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("foods")) db.createObjectStore("foods", { keyPath: "id" });
      if (!db.objectStoreNames.contains("videos")) db.createObjectStore("videos", { keyPath: "id" });
      if (!db.objectStoreNames.contains("characters")) db.createObjectStore("characters", { keyPath: "id" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function loadCustomCharacters() {
  try {
    const db = await foodsDB();
    customCharacters = await new Promise((resolve, reject) => {
      const req = db.transaction("characters").objectStore("characters").getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } catch (_) {
    customCharacters = [];
  }
}

/* ---------- on-phone "make it a cartoon" filter ----------
   Smooth (repeated down/up-scaling), boost saturation, flatten the colours
   into a few levels, then darken strong edges for an outline. All canvas
   work, so it runs instantly and offline. */

function cartoonize(source) {
  const SIZE = 320;
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = SIZE;
  const ctx = canvas.getContext("2d");

  // smoothing pass: shrink and re-enlarge twice
  const small = document.createElement("canvas");
  small.width = small.height = 80;
  const sctx = small.getContext("2d");
  sctx.drawImage(source, 0, 0, 80, 80);
  ctx.filter = "saturate(1.4)";
  ctx.drawImage(small, 0, 0, SIZE, SIZE);
  ctx.filter = "none";
  sctx.drawImage(canvas, 0, 0, 80, 80);
  ctx.drawImage(small, 0, 0, SIZE, SIZE);

  const img = ctx.getImageData(0, 0, SIZE, SIZE);
  const d = img.data;

  // edge map from the smoothed image (simple gradient magnitude)
  const gray = new Float32Array(SIZE * SIZE);
  for (let i = 0; i < SIZE * SIZE; i++) {
    gray[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
  }
  const edge = new Float32Array(SIZE * SIZE);
  for (let y = 1; y < SIZE - 1; y++) {
    for (let x = 1; x < SIZE - 1; x++) {
      const i = y * SIZE + x;
      const gx = gray[i + 1] - gray[i - 1];
      const gy = gray[i + SIZE] - gray[i - SIZE];
      edge[i] = Math.min(1, Math.sqrt(gx * gx + gy * gy) / 60);
    }
  }

  // posterize + outline
  const LEVELS = 5;
  const step = 255 / (LEVELS - 1);
  for (let i = 0; i < SIZE * SIZE; i++) {
    const e = edge[i] > 0.45 ? 0.65 : 0;
    for (let c = 0; c < 3; c++) {
      const q = Math.round(d[i * 4 + c] / step) * step;
      d[i * 4 + c] = q * (1 - e);
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas.toDataURL("image/jpeg", 0.85);
}

/* read a picked photo, centre-crop it square, return both versions */
function processPhoto(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      const side = Math.min(im.width, im.height);
      const sx = (im.width - side) / 2;
      const sy = (im.height - side) / 2;
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 512;
      canvas.getContext("2d").drawImage(im, sx, sy, side, side, 0, 0, 512, 512);
      resolve({ photo: canvas.toDataURL("image/jpeg", 0.85), cartoon: cartoonize(canvas) });
    };
    im.onerror = reject;
    im.src = url;
  });
}

const NEARLY_SECONDS = 10;

const $ = (id) => document.getElementById(id);

const savedCharacter = localStorage.getItem("badb-character");
const state = {
  transition: null,
  food: null,
  totalSeconds: 0,
  remaining: 0,
  intervalId: null,
  paused: false,
  wakeLock: null,
  character:
    CHARACTERS.find((c) => c.id === savedCharacter || c.emoji === savedCharacter) ||
    CHARACTERS[0],
};

function characterHTML(c) {
  if (c.photo) return `<img class="char-photo" src="${c.photo}" alt="">`;
  return c.img ? `<img class="char-img" src="${c.img}" alt="">` : c.emoji;
}

/* ---------- screen switching ---------- */

function showScreen(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
  $(id).classList.add("active");
}

/* ---------- screen 1: transitions + character picker ---------- */

function buildChooseScreen() {
  const grid = $("transition-grid");
  TRANSITIONS.forEach((t) => {
    const card = document.createElement("button");
    card.className = "transition-card";
    card.innerHTML = `<span class="emoji">${transitionIconHTML(t)}</span><span class="label">${t.label}</span>`;
    card.addEventListener("click", () => {
      state.transition = t;
      state.food = null;
      if (t.id === "food") {
        showScreen("screen-food-category");
      } else if (t.fixedSeconds) {
        startTimer(t.fixedSeconds); // activity timers (like teeth) start straight away
      } else {
        $("time-emoji").innerHTML = transitionIconHTML(t);
        $("time-title").textContent = t.phrase;
        showScreen("screen-time");
      }
    });
    grid.appendChild(card);
  });

  buildCharacterPicker();
}

/* The character picker: the drawn avatar, the emoji kids, any photo
   characters the family has added, and a ＋ to add one from a photo of
   their own kid (cropped round, stored on the device). */
function buildCharacterPicker() {
  const picker = $("character-picker");
  picker.innerHTML = "";
  [...CHARACTERS, ...customCharacters].forEach((c) => {
    const opt = document.createElement("button");
    opt.className = "character-option" + (c.id === state.character.id ? " selected" : "");
    opt.innerHTML = characterHTML(c);
    if (c.photo) {
      const remove = document.createElement("span");
      remove.className = "char-remove";
      remove.textContent = "✕";
      remove.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!confirm("Remove this character?")) return;
        try { await deleteCustomCharacter(c.id); } catch (_) { /* remove for the session anyway */ }
        customCharacters = customCharacters.filter((x) => x.id !== c.id);
        if (state.character.id === c.id) {
          state.character = CHARACTERS[0];
          localStorage.setItem("badb-character", state.character.id);
        }
        buildCharacterPicker();
      });
      opt.appendChild(remove);
    }
    opt.addEventListener("click", () => {
      state.character = c;
      localStorage.setItem("badb-character", c.id);
      buildCharacterPicker();
    });
    picker.appendChild(opt);
  });

  const add = document.createElement("label");
  add.className = "character-option add-character";
  add.innerHTML = `＋<input type="file" accept="image/*" hidden>`;
  add.querySelector("input").addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const photo = await squareCropPhoto(file, 256);
      const character = { id: `char-${Date.now()}`, photo };
      await saveCustomCharacter(character).catch(() => {});
      customCharacters.push(character);
      state.character = character;
      localStorage.setItem("badb-character", character.id);
      buildCharacterPicker();
    } catch (_) { /* unreadable image — leave the picker as it was */ }
  });
  picker.appendChild(add);
}

/* centre-crop any image square, used for photo characters */
function squareCropPhoto(file, size) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      const side = Math.min(im.width, im.height);
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      canvas.getContext("2d").drawImage(im, (im.width - side) / 2, (im.height - side) / 2, side, side, 0, 0, size, size);
      resolve(canvas.toDataURL("image/jpeg", 0.88));
    };
    im.onerror = reject;
    im.src = url;
  });
}

/* ---------- screens 1b/1c: dinner-or-dessert, then pick the food ---------- */

function buildFoodGrid(category) {
  state.foodCategory = category;
  const grid = $("food-grid");
  grid.innerHTML = "";
  [...FOODS, ...customFoods]
    .filter((f) => f.cats.includes(category))
    .forEach((f) => {
      const card = document.createElement("button");
      card.className = "transition-card";
      card.innerHTML = `<span class="emoji">${foodHTML(f)}</span><span class="label">${f.label}</span>`;
      card.addEventListener("click", () => {
        state.food = f;
        $("time-emoji").innerHTML = foodHTML(f);
        $("time-title").textContent = f.phrase;
        showScreen("screen-time");
      });
      grid.appendChild(card);
    });
  $("edit-foods-btn").hidden = customFoods.length === 0;
}

$("cat-dinner").addEventListener("click", () => {
  buildFoodGrid("dinner");
  showScreen("screen-food");
});
$("cat-dessert").addEventListener("click", () => {
  buildFoodGrid("dessert");
  showScreen("screen-food");
});
$("back-category").addEventListener("click", () => showScreen("screen-choose"));
$("back-food").addEventListener("click", () => showScreen("screen-food-category"));

/* ---------- screen 2: time buttons ---------- */

function buildTimeScreen() {
  const grid = $("time-grid");
  MINUTES.forEach((m) => {
    const btn = document.createElement("button");
    btn.className = "time-btn";
    btn.textContent = m === 1 ? "1 minute" : `${m} minutes`;
    btn.addEventListener("click", () => startTimer(m * 60));
    grid.appendChild(btn);
  });
}

/* ---------- screen 3: the countdown ---------- */

function startTimer(seconds) {
  state.totalSeconds = seconds;
  state.remaining = seconds;
  state.paused = false;

  $("timer-phrase").textContent = state.food ? state.food.phrase : state.transition.phrase;
  $("walker-emoji").innerHTML = characterHTML(state.character);
  // activity timers (teeth) swap the journey for a do-it-along close-up
  const brushing = state.transition.activity === "brush" && state.character.img;
  $("walker").style.display = brushing ? "none" : "";
  if (brushing) $("destination-emoji").innerHTML = brushingSceneSVG();
  else if (state.food) $("destination-emoji").innerHTML = foodHTML(state.food);
  else $("destination-emoji").innerHTML = transitionIconHTML(state.transition);
  $("destination").classList.toggle("center", brushing);
  // scene-style destinations (brushing, dance party, aquarium) get extra room
  $("destination").classList.toggle(
    "huge",
    brushing || (!state.food && ["disco", "aquarium"].includes(state.transition.id))
  );
  $("walker").classList.add("walking");
  $("destination").classList.remove("nearly");
  $("progress-fill").classList.remove("nearly");
  $("pause-btn").textContent = "⏸ Pause";

  renderTick();
  showScreen("screen-timer");
  requestWakeLock();
  startMusic();

  // Track the real clock rather than counting ticks — browser timers get
  // throttled on long waits, and "finish at 8pm" must actually mean 8pm.
  state.endTime = Date.now() + seconds * 1000;
  clearInterval(state.intervalId);
  state.intervalId = setInterval(() => {
    if (state.paused) return;
    state.remaining = Math.max(0, Math.round((state.endTime - Date.now()) / 1000));
    renderTick();
    if (state.remaining <= 0) finishTimer();
  }, 1000);
}

function renderTick() {
  const h = Math.floor(state.remaining / 3600);
  const m = Math.floor((state.remaining % 3600) / 60);
  const s = state.remaining % 60;
  $("time-left").textContent = h > 0
    ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`
    : `${m}:${String(s).padStart(2, "0")}`;

  const progress = 1 - state.remaining / state.totalSeconds;
  // Walker travels from 4% to ~78% so it stops beside the destination.
  $("walker").style.left = `${4 + progress * 74}%`;
  $("progress-fill").style.width = `${(1 - progress) * 100}%`;

  if (state.remaining <= NEARLY_SECONDS && state.remaining > 0) {
    $("destination").classList.add("nearly");
    $("progress-fill").classList.add("nearly");
    $("timer-phrase").textContent = "Nearly there!";
  }
}

function finishTimer() {
  clearInterval(state.intervalId);
  state.intervalId = null;
  releaseWakeLock();
  stopMusic();

  // Teeth done: a sparkly-smile close-up with a cheer.
  if (state.transition.activity === "brush" && state.character.img) {
    $("done-emoji").innerHTML = sparkleSmileSVG();
    $("done-phrase").textContent = state.transition.done;
    showScreen("screen-done");
    playChime();
    setTimeout(playYay, 1400);
    dropConfetti(["✨", "⭐", "💛", "🫧"], 26);
    return;
  }

  // Food arrivals are the celebration: a close-up of her eating the food
  // she picked (with the drawn avatar), a cheer, and extra confetti.
  if (state.food) {
    if (state.character.img) {
      $("done-emoji").innerHTML = eatingSceneSVG(state.food);
    } else {
      $("done-emoji").innerHTML = `${characterHTML(state.character)}${foodHTML(state.food)}`;
    }
    $("done-phrase").textContent = state.food.done;
    showScreen("screen-done");
    playChime();
    setTimeout(playYay, 1400);
    dropConfetti(["⭐", "🎉", "✨", "💛", "🌟"], 26);
    return;
  }

  $("done-emoji").innerHTML = `${characterHTML(state.character)}${transitionIconHTML(state.transition)}`;
  $("done-phrase").textContent = state.transition.done;
  showScreen("screen-done");
  playChime();
  dropConfetti();
}

/* A little cheer: a spoken "Yay!" where speech synthesis exists, plus a
   quick sparkly run-up so there's always something joyful to hear. */
function playYay() {
  try {
    if ("speechSynthesis" in window) {
      const yay = new SpeechSynthesisUtterance("Yay!");
      yay.pitch = 1.8;
      yay.rate = 1.1;
      speechSynthesis.speak(yay);
    }
  } catch (_) { /* fine without it */ }
  try {
    const notes = [659.25, 783.99, 987.77, 1318.5]; // E5 G5 B5 E6
    notes.forEach((freq, i) => {
      const t = audioCtx.currentTime + i * 0.09;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.16, t + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.7);
    });
  } catch (_) { /* fine without it */ }
}

/* ---------- gentle looping background music ----------
   A tiny music box waltzing through C – Am – F – G, generated with the
   Web Audio API so there are no audio files and it works offline. It sits
   quietly under the countdown and stops before the arrival chime. */

const MUSIC_TEMPO = 68;           // beats per minute — a calm walking pace
const MUSIC_LOOP_BEATS = 32;      // 8 bars of 4 beats
const MUSIC_EVENTS = (() => {
  const events = [];
  // soft bass note at the start of each bar: C C Am Am F F G G
  [48, 48, 45, 45, 53, 53, 55, 55].forEach((midi, bar) => {
    events.push({ beat: bar * 4, midi, beats: 3.6, gain: 0.07 });
  });
  // music-box arpeggio, one plink per beat
  const arps = [
    [64, 67, 72, 67], [64, 67, 72, 67],   // C:  E4 G4 C5 G4
    [64, 69, 72, 69], [64, 69, 72, 69],   // Am: E4 A4 C5 A4
    [65, 69, 72, 69], [65, 69, 72, 69],   // F:  F4 A4 C5 A4
    [62, 67, 71, 67], [62, 67, 71, 67],   // G:  D4 G4 B4 G4
  ];
  arps.forEach((bar, b) => bar.forEach((midi, i) => {
    events.push({ beat: b * 4 + i, midi, beats: 1.3, gain: 0.045 });
  }));
  // a sparse, singable melody floating on top
  [
    [0, 76, 1], [1, 79, 1], [2, 72, 2],
    [8, 69, 1], [9, 72, 1], [10, 76, 2],
    [16, 77, 1], [17, 76, 1], [18, 72, 2],
    [24, 74, 1], [25, 71, 1], [26, 74, 2],
  ].forEach(([beat, midi, beats]) => events.push({ beat, midi, beats, gain: 0.085 }));
  return events;
})();

let musicOn = localStorage.getItem("badb-music") !== "off";
const music = { master: null, schedulerId: null, startTime: 0, nextBeat: 0 };

function startMusic() {
  if (!musicOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    stopMusic(true);

    const filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 2600;
    music.master = audioCtx.createGain();
    music.master.gain.value = 1;
    music.master.connect(filter).connect(audioCtx.destination);

    const spb = 60 / MUSIC_TEMPO;
    music.startTime = audioCtx.currentTime + 0.15;
    music.nextBeat = 0;
    music.schedulerId = setInterval(() => {
      // schedule everything due in the next half-second
      while (music.startTime + music.nextBeat * spb < audioCtx.currentTime + 0.55) {
        const loopBeat = music.nextBeat % MUSIC_LOOP_BEATS;
        const t = music.startTime + music.nextBeat * spb;
        MUSIC_EVENTS.forEach((ev) => {
          if (ev.beat === loopBeat) playMusicNote(t, ev.midi, ev.beats * spb, ev.gain);
        });
        music.nextBeat += 1;
      }
    }, 150);
  } catch (_) {
    /* no audio — the timer is fully usable in silence */
  }
}

function playMusicNote(t, midi, dur, peak) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(peak, t + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.5);
  osc.connect(gain).connect(music.master);
  osc.start(t);
  osc.stop(t + dur + 0.6);
}

function stopMusic(immediate) {
  clearInterval(music.schedulerId);
  music.schedulerId = null;
  if (music.master) {
    const m = music.master;
    music.master = null;
    if (immediate) {
      m.disconnect();
    } else {
      m.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.1);
      setTimeout(() => m.disconnect(), 600);
    }
  }
}

/* ---------- gentle chime (Web Audio, no audio files needed) ---------- */

let audioCtx = null;

function playChime() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    // A soft rising arpeggio, played twice. Triangle waves with a slow
    // release keep it cheerful without being startling.
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    [0, 1].forEach((round) => {
      notes.forEach((freq, i) => {
        const t = audioCtx.currentTime + round * 1.4 + i * 0.22;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.25, t + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 1);
      });
    });
  } catch (_) {
    /* no audio available — the visual arrival still tells the story */
  }
}

/* ---------- calm confetti ---------- */

function dropConfetti(pieces = ["⭐", "✨", "🎈", "💛"], count = 18) {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = $("confetti");
  box.innerHTML = "";
  for (let i = 0; i < count; i++) {
    const span = document.createElement("span");
    span.textContent = pieces[i % pieces.length];
    span.style.left = `${(i * 137) % 100}%`;
    span.style.animationDuration = `${3 + (i % 5) * 0.6}s`;
    span.style.animationDelay = `${(i % 7) * 0.25}s`;
    box.appendChild(span);
  }
}

/* ---------- instant videos: import once, play in one tap ----------
   Videos are stored whole in IndexedDB, so playback starts instantly
   from local storage — no network, no buffering, no adverts. */

let removingVideos = false;
let renamingVideos = false;

/* Downloaded films arrive named like "Some.Film.1967.1080p.BluRay.x264-GROUP".
   Strip the release gibberish so tiles start with a sensible name. */
function cleanVideoName(filename) {
  let name = filename.replace(/\.[^.]+$/, "").replace(/[._]+/g, " ");
  const cut = name.search(
    /\b((19|20)\d{2}|2160p|1080p|720p|480p|4k|x264|x265|h ?264|h ?265|hevc|webrip|web ?dl|bluray|brrip|hdrip|dvdrip|remux|proper|repack|extended|remastered)\b/i
  );
  if (cut > 0) name = name.slice(0, cut);
  name = name.replace(/[[\](){}-]+/g, " ").replace(/\s+/g, " ").trim();
  return name || filename.replace(/\.[^.]+$/, "");
}

/* Probe whether this phone can actually decode the file, and grab a
   thumbnail while we're in there. Torrented films are often HEVC/x265 or
   AC3 inside an .mp4/.mkv — containers this browser opens but codecs it
   can't decode — and silently importing those gives a "playing" black
   screen. Better to say so at import time. */
function probeVideo(file) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const v = document.createElement("video");
    const done = (result) => { URL.revokeObjectURL(url); resolve(result); };
    // Big files on slow storage can be sluggish — assume OK on timeout.
    const timeout = setTimeout(() => done({ playable: true, thumb: null }), 8000);
    v.muted = true;
    v.preload = "auto";
    v.onloadeddata = () => {
      if (!v.videoWidth) {
        // container opened but the video track can't be decoded
        clearTimeout(timeout);
        done({ playable: false, thumb: null });
        return;
      }
      v.currentTime = Math.min(1, (v.duration || 2) / 2);
    };
    v.onseeked = () => {
      clearTimeout(timeout);
      const canvas = document.createElement("canvas");
      canvas.width = 320;
      canvas.height = 180;
      const scale = Math.max(320 / v.videoWidth, 180 / v.videoHeight);
      const w = v.videoWidth * scale;
      const h = v.videoHeight * scale;
      canvas.getContext("2d").drawImage(v, (320 - w) / 2, (180 - h) / 2, w, h);
      done({ playable: true, thumb: canvas.toDataURL("image/jpeg", 0.8) });
    };
    v.onerror = () => { clearTimeout(timeout); done({ playable: false, thumb: null }); };
    v.src = url;
  });
}

function buildVideoGrid() {
  const grid = $("video-grid");
  grid.innerHTML = "";
  grid.classList.toggle("removing", removingVideos);
  customVideos.forEach((v) => {
    const tile = document.createElement("button");
    tile.className = "video-tile";
    tile.innerHTML = `
      ${v.thumb ? `<img src="${v.thumb}" alt="">` : `<span class="placeholder">🎬</span>`}
      <span class="play-badge">▶️</span>
      <span class="name">${v.label}</span>`;
    tile.addEventListener("click", async () => {
      if (renamingVideos) {
        const name = prompt("What should this be called?", v.label);
        if (name === null) return;
        v.label = name.trim() || v.label;
        try { await saveCustomVideo(v); } catch (_) { /* keep the new name for the session */ }
        buildVideoGrid();
      } else if (removingVideos) {
        if (!confirm(`Remove ${v.label}?`)) return;
        try { await deleteCustomVideo(v.id); } catch (_) { /* remove for the session anyway */ }
        customVideos = customVideos.filter((x) => x.id !== v.id);
        removingVideos = customVideos.length > 0 && removingVideos;
        buildVideoGrid();
      } else {
        openVideo(v);
      }
    });
    grid.appendChild(tile);
  });
  grid.classList.toggle("renaming", renamingVideos);
  $("video-remove-btn").hidden = customVideos.length === 0;
  $("video-remove-btn").textContent = removingVideos ? "✓ Done" : "🗑 Remove";
  $("video-rename-btn").hidden = customVideos.length === 0;
  $("video-rename-btn").textContent = renamingVideos ? "✓ Done" : "✎ Rename";
  $("video-hint").textContent = customVideos.length === 0
    ? "Add favourite videos here in a quiet moment — after that they play instantly, even offline."
    : "";
}

let playingURL = null;

function openVideo(v) {
  playingURL = URL.createObjectURL(v.blob);
  const el = $("video-el");

}

function closeVideo() {
  const el = $("video-el");

  if (playingURL) URL.revokeObjectURL(playingURL);
  playingURL = null;
  $("video-player").hidden = true;
}

async function handleVideoImport(e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  $("video-hint").textContent = "Adding… (big films take a minute)";
  const { playable, thumb } = await probeVideo(file);
  if (!playable) {
    $("video-hint").textContent = "";
    alert(
      `This phone can't play "${file.name}".\n\n` +
        "It's usually the codecs inside the file (often HEVC/x265 video or AC3 audio), " +
        "even when the file is an .mp4. A version using H.264/x264 video with AAC audio " +
        "will work — converting on a computer with the free HandBrake app " +
        '("Fast 1080p30" preset) fixes it.'
    );
    buildVideoGrid();
    return;
  }
  const video = {
    id: `video-${Date.now()}`,
    label: cleanVideoName(file.name),
    blob: file,
    thumb,
  };
  try {
    await saveCustomVideo(video);
  } catch (_) {
    $("video-hint").textContent = "Couldn't store that video (not enough space?) — it will play until the app closes.";
  }
  customVideos.push(video);
  buildVideoGrid();
}

$("video-input-files").addEventListener("change", handleVideoImport);

$("add-food-btn").addEventListener("click", () => openAddFood(null));
$("edit-foods-btn").addEventListener("click", () => {
  buildEditFoodList();
  showScreen("screen-edit-foods");
});
$("back-add-food").addEventListener("click", () => showScreen("screen-food"));
$("back-edit-foods").addEventListener("click", () => {
  buildFoodGrid(state.foodCategory || "dinner");
  showScreen("screen-food");
});

buildChooseScreen();
buildTimeScreen();
loadCustomFoods();
loadCustomVideos();
loadCustomCharacters().then(() => {
  // a saved photo character can only be resolved once they're loaded
  const saved = customCharacters.find((c) => c.id === savedCharacter);
  if (saved) state.character = saved;
  buildCharacterPicker();
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  // When an update finishes installing, switch to it right away instead of
  // waiting for the next launch — but never mid-countdown or mid-video.
  let reloadedForUpdate = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloadedForUpdate) return;
    const idle =
      !state.intervalId &&
      $("screen-choose").classList.contains("active") &&
      $("video-player").hidden;
    if (idle) {
      reloadedForUpdate = true;
      location.reload();
    }
  });
}
$("version-tag").textContent = `v${APP_VERSION}`;
</script>
</body>
</html>
